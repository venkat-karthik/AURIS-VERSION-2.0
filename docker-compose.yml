version: '3.8'

services:
  auris-voice-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auris-voice-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

